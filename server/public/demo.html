<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마중 · 시연</title>
<style>
/* 시연용: 왼쪽에 차량 화면 프로토타입, 오른쪽에 탑승자 휴대폰 웹. 화면 녹화는 이 페이지 하나만 찍으면 된다. */
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#131417;color:#fff;font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overflow:hidden}
#wrap{display:flex;gap:24px;height:calc(100% - 96px);padding:20px 20px 12px;box-sizing:border-box;align-items:center}
#cc{height:96px;box-sizing:border-box;padding:0 28px 16px;display:flex;align-items:center;gap:18px;font-size:26px;font-weight:700;line-height:1.3}
#cc span{font-size:14px;font-weight:400;color:#9498a1;white-space:nowrap;border:1px solid #3a3c42;border-radius:8px;padding:4px 10px}
#cc b{font-weight:700}#cc.idle b{color:#6b6e76;font-weight:400;font-size:18px}
#car{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:10px;height:100%}
#car iframe{flex:1;border:0;border-radius:14px;background:#1d1e21;width:100%}
#phone{flex:none;display:flex;flex-direction:column;gap:10px;align-items:center}
#phone .frame{width:300px;height:622px;border-radius:40px;border:8px solid #2b2d33;background:#f7f8fa;overflow:hidden;position:relative}
#phone iframe{border:0;width:375px;height:777px;transform:scale(.757);transform-origin:0 0}
.cap{font-size:13px;color:#9498a1;display:flex;gap:12px;align-items:center;min-height:32px}
.cap b{color:#fff;font-size:15px}
button{font:inherit;font-size:13px;border:0;border-radius:10px;padding:8px 14px;background:#2b2d33;color:#fff;cursor:pointer}
button.go{background:#0064ff}
#scan{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#131417;text-align:center;padding:32px;font-size:15px;line-height:1.5}
</style>
</head>
<body>
<div id="wrap">
  <div id="car">
    <div class="cap"><b>차량 화면</b>웹 프로토타입 · 마중 화면은 실제 서버 상태, 내비·위치·기어·비상등은 모의<button id="reset" style="margin-left:auto">처음부터</button></div>
    <iframe id="carframe" src="/car" title="차량 화면"></iframe>
  </div>
  <div id="phone">
    <div class="cap"><b>탑승자 휴대폰</b>실제 모바일 웹</div>
    <div class="frame"><iframe id="phoneframe" title="탑승자 휴대폰" hidden></iframe>
      <div id="scan"><div>차량 화면의 QR 코드를<br>휴대폰으로 찍는 단계입니다.</div><button class="go" id="scanbtn" disabled>QR 찍기</button></div></div>
  </div>
</div>
<div id="cc" class="idle"><span>차량 음성 안내 (자막)</span><b id="cctext">음성 안내가 나올 때 여기에 자막으로 표시됩니다.</b></div>
<script>
let invite = null;
addEventListener('message', (e) => {
  if (e.origin !== location.origin || !('majungCaption' in (e.data ?? {}))) return;
  const cc = document.getElementById('cc'), t = e.data.majungCaption;
  cc.classList.toggle('idle', !t); document.getElementById('cctext').textContent = t ?? '';
});
addEventListener('message', (e) => { if (e.origin === location.origin && e.data?.majungInvite) { invite = e.data.majungInvite; document.getElementById('scanbtn').disabled = false; } });
const phone = document.getElementById('phoneframe'), scan = document.getElementById('scan');
if (localStorage.getItem('majung.token')) { scan.hidden = true; phone.hidden = false; phone.src = '/'; }     // 이미 연결된 휴대폰
document.getElementById('scanbtn').onclick = () => { scan.hidden = true; phone.hidden = false; phone.src = new URL(invite).pathname + new URL(invite).search; };
document.getElementById('reset').onclick = () => { localStorage.removeItem('majung.token'); localStorage.removeItem('majung.car'); location.reload(); };
</script>
</body>
</html>
